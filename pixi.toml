[workspace]
channels = ["https://prefix.dev/conda-forge"]
name = "pytorch-conda-forge"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

# ---------- Shared (vendor-neutral) dependencies ----------
[dependencies]
numpy = ">=2.4.1,<3"
matplotlib = ">=3.10.8,<4"
pip = ">=25.3,<26"
ipykernel = ">=7.1.0,<8"
uproot = ">=5.6.9,<6"
click = ">=8.3.1,<9"
structlog = ">=24.4.0,<25"
pandas = ">=2.2.0,<3"
pyyaml = ">=6.0,<7"
corner = "*"
scikit-learn = "*"
scipy = "*"
seaborn = ">=0.13.2,<0.14"

[pypi-dependencies]
tabpfn = ">=7.1.0"

# ---------- NVIDIA (CUDA) feature ----------
[feature.cuda.dependencies]
pytorch-gpu = "*"
gpytorch = "*"

[feature.cuda.system-requirements]
cuda = "12.6"

# ---------- AMD (ROCm) feature ----------
# conda-forge does not ship ROCm PyTorch, so we install via pip from the
# PyTorch ROCm wheel index.  We use rocm6.1/torch 2.4.x because the rocm6.2
# index only has torch 2.5.x which requires pytorch-triton-rocm==3.1.0 — a
# package that was pulled from PyPI.  Update if your cluster has a newer ROCm.
[feature.rocm.dependencies]
python = ">=3.11,<3.13"

[feature.rocm.pypi-dependencies]
torch = {version = ">=2.4.0,<2.5.0", index = "https://download.pytorch.org/whl/rocm6.1"}
gpytorch = ">=1.12"

# ---------- Environments ----------
[environments]
cuda = ["cuda"]
rocm = ["rocm"]
